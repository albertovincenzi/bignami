version: 2

builds:
  - env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

# The formula goes to the shared tap, so users run one command: brew install albertovincenzi/tap/bignami
# shortcut: 'brews' is deprecated in favour of 'homebrew_casks', but a cask needs a signed binary
# or an xattr hook that turns off Gatekeeper; a formula does not. Move when GoReleaser v3 drops 'brews'.
brews:
  - name: bignami
    repository:
      owner: albertovincenzi
      name: homebrew-tap
      git:
        url: git@github.com:albertovincenzi/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    directory: Formula
    homepage: https://github.com/albertovincenzi/bignami
    description: "A TUI cheat sheet for forgetful devs: AWS and Kubernetes commands with live output"
    license: MIT
    commit_author:
      name: bignami-release
      email: 9381203+albertovincenzi@users.noreply.github.com
    caveats: |
      bignami runs the AWS CLI and kubectl. Install what you use:
        brew install awscli kubernetes-cli
    test: |
      assert_match "bignami", shell_output("#{bin}/bignami --version")
